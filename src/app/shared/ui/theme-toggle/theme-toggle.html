<button
  type="button"
  (click)="theme.toggle()"
  [attr.aria-label]="theme.isDark() ? 'Ativar modo claro' : 'Ativar modo escuro'"
  class="flex size-10 items-center justify-center rounded-xl border border-line bg-surface text-muted transition-colors hover:text-brand"
>
  @if (theme.isDark()) {
    <ng-icon name="lucideSun" size="18" />
  } @else {
    <ng-icon name="lucideMoon" size="18" />
  }
</button>
