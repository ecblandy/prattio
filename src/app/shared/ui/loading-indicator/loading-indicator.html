@if (loading.visible()) {
  <div
    class="fixed inset-0 z-90 grid place-items-center bg-page/70 px-4 backdrop-blur-sm"
    role="status"
    aria-live="polite"
    aria-label="Carregando página"
  >
    <div
      class="flex items-center gap-3 rounded-lg border border-line bg-surface px-5 py-4 text-ink shadow-xl"
    >
      <ng-icon name="lucideLoaderCircle" size="20" class="animate-spin text-brand-2" />
      <span class="text-sm font-medium">Carregando…</span>
    </div>
  </div>
}
