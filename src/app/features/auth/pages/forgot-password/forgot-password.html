<section class="mx-auto flex min-h-screen w-full flex-col items-center px-6 pt-16 sm:pt-24">
  <img
    src="/assets/images/icon_512.png"
    alt="Logo da Prattio"
    width="117"
    height="101"
    fetchpriority="high"
    decoding="async"
    class="mb-10 h-auto w-24 object-contain sm:w-28"
  />

  <!-- Header -->
  <div class="flex w-full max-w-sm flex-col items-center text-center">
    <h1 class="text-2xl font-bold tracking-tight text-gray-900 sm:text-3xl">Recuperar acesso</h1>

    <span class="mt-2 text-sm font-medium leading-relaxed text-gray-500 sm:text-base">
      Informe seu e-mail para receber as instruções de recuperação da sua senha.
    </span>

    <div class="mt-6 h-1 w-12 rounded-full bg-brand"></div>
  </div>

  <!-- Form -->
  <form
    class="mt-10 w-full max-w-sm"
    (submit)="requestPasswordReset($event)"
    novalidate
    method="post"
  >
    <fieldset class="flex flex-col gap-5">
      <!-- Email field -->
      <div class="flex flex-col gap-2">
        <label for="email" class="text-sm font-semibold text-gray-700"> E-mail </label>

        <div class="relative">
          <ng-icon
            name="lucideMail"
            size="18"
            class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"
          />

          <input
            id="email"
            type="email"
            placeholder="Digite seu e-mail..."
            autocomplete="email"
            [formField]="forgotPasswordForm.email"
            class="w-full rounded-xl border border-gray-200 bg-gray-50 py-3.5 pl-11 pr-4 text-sm text-gray-900 outline-none transition-all placeholder:text-gray-400 hover:border-gray-300 focus:border-brand focus:bg-white focus:ring-4 focus:ring-brand/10"
          />
        </div>

        <app-field-errors
          [touched]="forgotPasswordForm.email().touched()"
          [errors]="forgotPasswordForm.email().errors()"
        />
      </div>
    </fieldset>

    <!-- Submit -->
    <button
      type="submit"
      [disabled]="forgotPasswordForm().submitting()"
      class="mt-8 flex w-full items-center justify-center gap-2 rounded-xl bg-brand py-3.5 text-sm font-semibold text-white shadow-sm shadow-brand/20 transition-all hover:bg-brand/90 active:scale-[0.98] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand disabled:cursor-not-allowed disabled:opacity-60"
    >
      @if (forgotPasswordForm().submitting()) {
        Enviando...
      } @else {
        Recuperar senha
        <ng-icon name="lucideArrowRight" size="18" />
      }
    </button>

    <!-- Back to signin -->
    <a
      routerLink="/auth/signin"
      class="mt-6 flex w-full items-center justify-center text-sm font-semibold text-gray-500 transition-colors hover:text-brand cursor-pointer"
    >
      Voltar para o login
    </a>
  </form>
</section>
