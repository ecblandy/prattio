<section class="flex w-full max-w-sm flex-col items-center">
  <div class="flex w-full flex-col items-center text-center">
    <div class="mb-4 flex size-14 items-center justify-center rounded-2xl bg-brand/10 text-brand">
      <ng-icon name="lucideUserRound" size="28" />
    </div>
    <h1 class="text-2xl font-bold tracking-tight text-ink sm:text-3xl">Cadastro de cliente</h1>
    <p class="mt-2 text-sm font-medium text-muted sm:text-base">
      Crie sua conta para pedir nos seus restaurantes favoritos.
    </p>
    <div class="mt-6 h-1 w-12 rounded-full bg-brand"></div>
  </div>

  <form class="mt-8 flex w-full flex-col gap-5" novalidate (submit)="onSubmit($event)">
    <div class="flex flex-col gap-2">
      <label for="client-name" class="text-sm font-semibold text-ink/80">Nome completo</label>
      <div class="relative">
        <ng-icon
          name="lucideUserRound"
          size="18"
          class="absolute left-4 top-1/2 -translate-y-1/2 text-muted"
        />
        <input
          id="client-name"
          type="text"
          autocomplete="name"
          placeholder="Digite seu nome completo"
          [formField]="clientForm.fullName"
          class="w-full rounded-xl border border-line bg-field py-3.5 pl-11 pr-4 text-sm text-ink outline-none transition-all placeholder:text-muted hover:border-muted focus:border-brand focus:bg-surface focus:ring-4 focus:ring-brand/10"
        />
      </div>
      <app-field-errors
        [touched]="clientForm.fullName().touched()"
        [errors]="clientForm.fullName().errors()"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label for="client-email" class="text-sm font-semibold text-ink/80">E-mail</label>
      <div class="relative">
        <ng-icon
          name="lucideMail"
          size="18"
          class="absolute left-4 top-1/2 -translate-y-1/2 text-muted"
        />
        <input
          id="client-email"
          type="email"
          autocomplete="email"
          placeholder="seu@email.com"
          [formField]="clientForm.email"
          class="w-full rounded-xl border border-line bg-field py-3.5 pl-11 pr-4 text-sm text-ink outline-none transition-all placeholder:text-muted hover:border-muted focus:border-brand focus:bg-surface focus:ring-4 focus:ring-brand/10"
        />
      </div>
      <app-field-errors
        [touched]="clientForm.email().touched()"
        [errors]="clientForm.email().errors()"
      />
    </div>

    <div class="grid w-full gap-5 sm:grid-cols-2">
      <div class="flex flex-col gap-2">
        <label for="client-cpf" class="text-sm font-semibold text-ink/80">CPF</label>
        <input
          id="client-cpf"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          mask="000.000.000-00"
          placeholder="000.000.000-00"
          [formField]="clientForm.cpf"
          class="w-full rounded-xl border border-line bg-field px-4 py-3.5 text-sm text-ink outline-none transition-all placeholder:text-muted hover:border-muted focus:border-brand focus:bg-surface focus:ring-4 focus:ring-brand/10"
        />
        <app-field-errors
          [touched]="clientForm.cpf().touched()"
          [errors]="clientForm.cpf().errors()"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label for="client-phone" class="text-sm font-semibold text-ink/80">Celular</label>
        <input
          id="client-phone"
          type="tel"
          inputmode="tel"
          autocomplete="tel"
          mask="(00) 00000-0000"
          placeholder="(00) 00000-0000"
          [formField]="clientForm.phone"
          class="w-full rounded-xl border border-line bg-field px-4 py-3.5 text-sm text-ink outline-none transition-all placeholder:text-muted hover:border-muted focus:border-brand focus:bg-surface focus:ring-4 focus:ring-brand/10"
        />
        <app-field-errors
          [touched]="clientForm.phone().touched()"
          [errors]="clientForm.phone().errors()"
        />
      </div>
    </div>

    <div class="flex flex-col gap-2">
      <label for="client-password" class="text-sm font-semibold text-ink/80">Senha</label>
      <div class="relative">
        <ng-icon
          name="lucideLockKeyhole"
          size="18"
          class="absolute left-4 top-1/2 -translate-y-1/2 text-muted"
        />
        <input
          id="client-password"
          [type]="showPassword() ? 'text' : 'password'"
          autocomplete="new-password"
          placeholder="Mínimo de 8 caracteres"
          [formField]="clientForm.password"
          class="w-full rounded-xl border border-line bg-field py-3.5 pl-11 pr-12 text-sm text-ink outline-none transition-all placeholder:text-muted hover:border-muted focus:border-brand focus:bg-surface focus:ring-4 focus:ring-brand/10"
        />
        <button
          type="button"
          (click)="showPassword.update((value) => !value)"
          [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'"
          class="absolute inset-y-0 right-4 flex items-center text-muted hover:text-brand-2"
        >
          <ng-icon [name]="showPassword() ? 'lucideEyeOff' : 'lucideEye'" size="18" />
        </button>
      </div>
      <app-field-errors
        [touched]="clientForm.password().touched()"
        [errors]="clientForm.password().errors()"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label for="client-confirm-password" class="text-sm font-semibold text-ink/80"
        >Confirmar senha</label
      >
      <div class="relative">
        <ng-icon
          name="lucideLockKeyhole"
          size="18"
          class="absolute left-4 top-1/2 -translate-y-1/2 text-muted"
        />
        <input
          id="client-confirm-password"
          [type]="showConfirmPassword() ? 'text' : 'password'"
          autocomplete="new-password"
          placeholder="Digite sua senha novamente"
          [formField]="clientForm.confirmPassword"
          class="w-full rounded-xl border border-line bg-field py-3.5 pl-11 pr-12 text-sm text-ink outline-none transition-all placeholder:text-muted hover:border-muted focus:border-brand focus:bg-surface focus:ring-4 focus:ring-brand/10"
        />
        <button
          type="button"
          (click)="showConfirmPassword.update((value) => !value)"
          [attr.aria-label]="showConfirmPassword() ? 'Ocultar senha' : 'Mostrar senha'"
          class="absolute inset-y-0 right-4 flex items-center text-muted hover:text-brand-2"
        >
          <ng-icon [name]="showConfirmPassword() ? 'lucideEyeOff' : 'lucideEye'" size="18" />
        </button>
      </div>
      <app-field-errors
        [touched]="clientForm.confirmPassword().touched()"
        [errors]="clientForm.confirmPassword().errors()"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label class="flex cursor-pointer items-start gap-3 text-xs leading-relaxed text-muted">
        <input
          type="checkbox"
          [formField]="clientForm.acceptedTerms"
          class="mt-0.5 size-4 shrink-0 accent-brand"
        />
        <span>
          Concordo com os
          <a href="/terms" class="font-semibold text-brand hover:underline">Termos de Uso</a> e a
          <a href="/privacy" class="font-semibold text-brand hover:underline"
            >Política de Privacidade</a
          >.
        </span>
      </label>
      <app-field-errors
        [touched]="clientForm.acceptedTerms().touched()"
        [errors]="clientForm.acceptedTerms().errors()"
      />
    </div>

    @if (submissionReady()) {
      <p role="status" class="rounded-lg border border-line bg-surface p-3 text-sm text-muted">
        Dados validados. O envio do cadastro depende da integração com o serviço.
      </p>
    }

    <button
      type="submit"
      [disabled]="clientForm().submitting()"
      [attr.aria-busy]="clientForm().submitting()"
      class="flex w-full items-center justify-center gap-2 rounded-xl bg-brand py-3.5 text-sm font-semibold text-white shadow-sm shadow-brand/20 transition-all hover:bg-brand/90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand disabled:cursor-not-allowed disabled:opacity-60"
    >
      @if (clientForm().submitting()) {
        <ng-icon name="lucideLoaderCircle" size="18" class="motion-safe:animate-spin" aria-hidden="true" />
        Processando...
      } @else {
        Criar conta de cliente
        <ng-icon name="lucideArrowRight" size="18" />
      }
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-muted">
    Escolheu outro perfil?
    <a
      routerLink="/auth/user-profile"
      class="font-semibold text-brand hover:text-brand-2 hover:underline"
    >
      Voltar
    </a>
  </p>
</section>
