<section class="mx-auto flex min-h-screen w-full flex-col items-center px-6 pt-16 sm:pt-24">
  <img
    src="/assets/images/icon_512.png"
    alt="Logo da Prattio"
    width="117"
    height="101"
    fetchpriority="high"
    decoding="async"
    class="mb-10 h-auto w-24 object-contain sm:w-28"
  />

  <!-- Header -->
  <div class="flex w-full max-w-sm flex-col items-center text-center">
    <div class="mb-6 flex h-16 w-16 items-center justify-center rounded-2xl bg-brand/10">
      <ng-icon name="lucideMailCheck" size="32" class="text-brand" />
    </div>

    <h1 class="text-2xl font-bold tracking-tight text-gray-900 sm:text-3xl">
      Verifique seu e-mail
    </h1>

    <span class="mt-3 text-sm font-medium leading-relaxed text-gray-500 sm:text-base">
      Se o endereço informado estiver cadastrado, você receberá um link para redefinir sua senha.
    </span>

    <div class="mt-6 h-1 w-12 rounded-full bg-brand"></div>
  </div>

  <!-- Information -->
  <div class="mt-8 w-full max-w-sm rounded-xl border border-gray-200 bg-white p-4">
    <div class="flex items-start gap-3">
      <ng-icon name="lucide-info" size="20" class="mt-0.5 shrink-0 text-brand" />

      <p class="text-sm leading-relaxed text-gray-600">
        Não recebeu o e-mail? Verifique sua caixa de spam ou lixo eletrônico.
      </p>
    </div>
  </div>

  <!-- Back to signin -->
  <a
    routerLink="/auth/signin"
    class="mt-8 flex w-full max-w-sm items-center justify-center gap-2 rounded-xl bg-brand py-3.5 text-sm font-semibold text-white shadow-sm shadow-brand/20 transition-all hover:bg-brand/90 active:scale-[0.98] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand"
  >
    <ng-icon name="lucideArrowLeft" size="18" />
    Voltar para o login
  </a>
</section>
