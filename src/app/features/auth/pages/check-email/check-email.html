<section class="flex w-full max-w-sm flex-col items-center">
  <div class="flex w-full flex-col items-center text-center">
    <div class="mb-6 flex h-16 w-16 items-center justify-center rounded-2xl bg-brand/10">
      <ng-icon name="lucideMailCheck" size="32" class="text-brand" />
    </div>

    <h1 class="text-2xl font-bold tracking-tight text-ink sm:text-3xl">Verifique seu e-mail</h1>

    <span class="mt-3 text-sm font-medium leading-relaxed text-muted sm:text-base">
      Se o endereço informado estiver cadastrado, você receberá um link para redefinir sua senha.
    </span>

    <div class="mt-6 h-1 w-12 rounded-full bg-brand"></div>
  </div>

  <div class="mt-8 w-full rounded-xl border border-line bg-surface p-4">
    <div class="flex items-start gap-3">
      <ng-icon name="lucideInfo" size="20" class="mt-0.5 shrink-0 text-brand" />

      <p class="text-sm leading-relaxed text-ink/80">
        Não recebeu o e-mail? Verifique sua caixa de spam ou lixo eletrônico.
      </p>
    </div>
  </div>

  <a
    routerLink="/auth/signin"
    class="mt-8 flex w-full items-center justify-center gap-2 rounded-xl bg-brand py-3.5 text-sm font-semibold text-white shadow-sm shadow-brand/20 transition-all hover:bg-brand/90 active:scale-[0.98] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand"
  >
    <ng-icon name="lucideArrowLeft" size="18" />
    Voltar para o login
  </a>
</section>
