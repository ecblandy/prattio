<section class="signin flex w-full max-w-sm flex-col items-center">
  <div class="signin-header flex w-full flex-col items-center text-center">
    <h1 class="text-2xl font-bold tracking-tight text-ink sm:text-3xl">Que bom ter você aqui!</h1>

    <span class="mt-2 text-sm font-medium text-muted sm:text-base">
      Acesse sua conta para continuar.
    </span>

    <div class="mt-6 h-1 w-12 rounded-full bg-brand"></div>
  </div>

  <form class="signin-form mt-10 w-full" (submit)="authenticate($event)" novalidate method="post">
    <fieldset class="flex flex-col gap-5" [disabled]="signinForm().submitting()">
      <!-- Email -->
      <div class="flex flex-col gap-2">
        <label for="email" class="text-sm font-semibold text-ink/80"> Email </label>

        <div class="relative">
          <ng-icon
            name="lucideMail"
            size="18"
            class="absolute left-4 top-1/2 -translate-y-1/2 text-muted"
          />

          <input
            id="email"
            type="email"
            placeholder="Digite seu email..."
            autocomplete="email"
            [formField]="signinForm.email"
            class="w-full rounded-xl border border-line bg-field py-3.5 pl-11 pr-4 text-sm text-ink outline-none transition-all placeholder:text-muted hover:border-muted focus:border-brand focus:bg-surface focus:ring-4 focus:ring-brand/10"
          />
        </div>

        <app-field-errors
          [touched]="signinForm.email().touched()"
          [errors]="signinForm.email().errors()"
        />
      </div>

      <!-- Senha -->
      <div class="flex flex-col gap-2">
        <label for="password" class="text-sm font-semibold text-ink/80"> Senha </label>

        <div class="relative">
          <ng-icon
            name="lucideLockKeyhole"
            size="18"
            class="absolute left-4 top-1/2 -translate-y-1/2 text-muted"
          />

          <input
            id="password"
            [type]="passwordVisible() ? 'text' : 'password'"
            [formField]="signinForm.password"
            placeholder="Digite sua senha..."
            autocomplete="current-password"
            class="w-full rounded-xl border border-line bg-field py-3.5 pl-11 pr-12 text-sm text-ink outline-none transition-all placeholder:text-muted hover:border-muted focus:border-brand focus:bg-surface focus:ring-4 focus:ring-brand/10"
          />

          <button
            type="button"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="passwordVisible() ? 'Ocultar senha' : 'Mostrar senha'"
            class="absolute inset-y-0 right-4 flex items-center justify-center text-muted transition-colors hover:text-brand"
          >
            @if (passwordVisible()) {
              <ng-icon name="lucideEyeOff" size="18" />
            } @else {
              <ng-icon name="lucideEye" size="18" />
            }
          </button>
        </div>

        <app-field-errors
          [touched]="signinForm.password().touched()"
          [errors]="signinForm.password().errors()"
        />

        <a
          routerLink="/auth/forgot-password"
          class="self-end text-sm font-semibold text-brand transition-colors hover:text-brand-2 hover:underline cursor-pointer"
        >
          Esqueceu a senha?
        </a>
      </div>
    </fieldset>

    <button
      type="submit"
      [disabled]="signinForm().submitting()"
      [attr.aria-busy]="signinForm().submitting()"
      class="signin-submit mt-8 flex w-full items-center justify-center gap-2 rounded-xl bg-brand py-3.5 text-sm font-semibold text-white shadow-sm shadow-brand/20 transition-all hover:bg-brand/90 active:scale-[0.98] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand disabled:cursor-not-allowed disabled:opacity-60"
    >
      @if (signinForm().submitting()) {
        <ng-icon name="lucideLoaderCircle" size="18" class="signin-spinner" aria-hidden="true" />
        Entrando...
      } @else {
        Entrar
        <ng-icon name="lucideArrowRight" size="18" />
      }
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-muted">
    Ainda não tem uma conta?
    <a
      routerLink="/auth/user-profile"
      class="font-semibold text-brand transition-colors hover:text-brand-2 hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand"
    >
      Cadastre-se
    </a>
  </p>
  <a
    routerLink="/auth/resend-confirmation"
    class="mt-3 text-center text-sm font-semibold text-brand hover:text-brand-2 hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand"
  >
    Reenviar confirmação de e-mail
  </a>
</section>
