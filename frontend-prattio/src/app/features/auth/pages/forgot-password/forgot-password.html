<section class="flex w-full max-w-sm flex-col items-center">
  <div class="flex w-full flex-col items-center text-center">
    <h1 class="text-2xl font-bold tracking-tight text-ink sm:text-3xl">Recuperar acesso</h1>

    <span class="mt-2 text-sm font-medium leading-relaxed text-muted sm:text-base">
      Informe seu e-mail para receber as instruções de recuperação da sua senha.
    </span>

    <div class="mt-6 h-1 w-12 rounded-full bg-brand"></div>
  </div>

  <form class="mt-10 w-full" (submit)="requestPasswordReset($event)" novalidate method="post">
    <fieldset class="flex flex-col gap-5">
      <div class="flex flex-col gap-2">
        <label for="email" class="text-sm font-semibold text-ink/80"> E-mail </label>

        <div class="relative">
          <ng-icon
            name="lucideMail"
            size="18"
            class="absolute left-4 top-1/2 -translate-y-1/2 text-muted"
          />

          <input
            id="email"
            type="email"
            placeholder="Digite seu e-mail..."
            autocomplete="email"
            [formField]="forgotPasswordForm.email"
            class="w-full rounded-xl border border-line bg-field py-3.5 pl-11 pr-4 text-sm text-ink outline-none transition-all placeholder:text-muted hover:border-muted focus:border-brand focus:bg-surface focus:ring-4 focus:ring-brand/10"
          />
        </div>

        <app-field-errors
          [touched]="forgotPasswordForm.email().touched()"
          [errors]="forgotPasswordForm.email().errors()"
        />
      </div>
    </fieldset>

    <button
      type="submit"
      [disabled]="forgotPasswordForm().submitting()"
      [attr.aria-busy]="forgotPasswordForm().submitting()"
      class="mt-8 flex w-full items-center justify-center gap-2 rounded-xl bg-brand py-3.5 text-sm font-semibold text-white shadow-sm shadow-brand/20 transition-all hover:bg-brand/90 active:scale-[0.98] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand disabled:cursor-not-allowed disabled:opacity-60"
    >
      @if (forgotPasswordForm().submitting()) {
        <ng-icon name="lucideLoaderCircle" size="18" class="motion-safe:animate-spin" aria-hidden="true" />
        Enviando...
      } @else {
        Recuperar senha
        <ng-icon name="lucideArrowRight" size="18" />
      }
    </button>

    <a
      routerLink="/auth/signin"
      class="mt-6 flex w-full items-center justify-center text-sm font-semibold text-muted transition-colors hover:text-brand cursor-pointer"
    >
      Voltar para o login
    </a>
  </form>
</section>
