<section class="flex w-full max-w-sm flex-col items-center">
  <div class="flex w-full flex-col items-center text-center">
    <div class="mb-4 flex size-14 items-center justify-center rounded-2xl bg-brand/10 text-brand">
      <ng-icon name="lucideStore" size="28" />
    </div>
    <h1 class="text-2xl font-bold tracking-tight text-ink sm:text-3xl">Cadastre seu restaurante</h1>
    <p class="mt-2 text-sm font-medium text-muted sm:text-base">
      Apresente seu estabelecimento para novos clientes.
    </p>
    <div class="mt-6 h-1 w-12 rounded-full bg-brand"></div>
  </div>

  <form class="mt-8 flex w-full flex-col gap-5" novalidate (submit)="onSubmit($event)">
    <div class="flex flex-col gap-2">
      <label for="restaurant-name" class="text-sm font-semibold text-ink/80">
        Nome do estabelecimento
      </label>
      <div class="relative">
        <ng-icon
          name="lucideStore"
          size="18"
          class="absolute left-4 top-1/2 -translate-y-1/2 text-muted"
        />
        <input
          id="restaurant-name"
          type="text"
          autocomplete="organization"
          placeholder="Nome exibido para os clientes"
          [formField]="restaurantForm.restaurantName"
          class="w-full rounded-xl border border-line bg-field py-3.5 pl-11 pr-4 text-sm text-ink outline-none transition-all placeholder:text-muted hover:border-muted focus:border-brand focus:bg-surface focus:ring-4 focus:ring-brand/10"
        />
      </div>
      <app-field-errors
        [touched]="restaurantForm.restaurantName().touched()"
        [errors]="restaurantForm.restaurantName().errors()"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label for="restaurant-cnpj" class="text-sm font-semibold text-ink/80">CNPJ</label>
      <div class="relative">
        <ng-icon
          name="lucideFileText"
          size="18"
          class="absolute left-4 top-1/2 -translate-y-1/2 text-muted"
        />
        <input
          id="restaurant-cnpj"
          type="text"
          autocapitalize="characters"
          autocomplete="off"
          mask="AA.AAA.AAA/AAAA-00"
          placeholder="00.000.000/0000-00"
          [formField]="restaurantForm.cnpj"
          class="w-full rounded-xl border border-line bg-field py-3.5 pl-11 pr-4 text-sm text-ink outline-none transition-all placeholder:text-muted hover:border-muted focus:border-brand focus:bg-surface focus:ring-4 focus:ring-brand/10"
        />
      </div>
      <app-field-errors
        [touched]="restaurantForm.cnpj().touched()"
        [errors]="restaurantForm.cnpj().errors()"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label for="responsible-name" class="text-sm font-semibold text-ink/80">
        Nome do responsável
      </label>
      <div class="relative">
        <ng-icon
          name="lucideUserRound"
          size="18"
          class="absolute left-4 top-1/2 -translate-y-1/2 text-muted"
        />
        <input
          id="responsible-name"
          type="text"
          autocomplete="name"
          placeholder="Responsável pelo cadastro"
          [formField]="restaurantForm.responsibleName"
          class="w-full rounded-xl border border-line bg-field py-3.5 pl-11 pr-4 text-sm text-ink outline-none transition-all placeholder:text-muted hover:border-muted focus:border-brand focus:bg-surface focus:ring-4 focus:ring-brand/10"
        />
      </div>
      <app-field-errors
        [touched]="restaurantForm.responsibleName().touched()"
        [errors]="restaurantForm.responsibleName().errors()"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label for="restaurant-email" class="text-sm font-semibold text-ink/80"
        >E-mail comercial</label
      >
      <div class="relative">
        <ng-icon
          name="lucideMail"
          size="18"
          class="absolute left-4 top-1/2 -translate-y-1/2 text-muted"
        />
        <input
          id="restaurant-email"
          type="email"
          autocomplete="email"
          placeholder="contato@restaurante.com.br"
          [formField]="restaurantForm.email"
          class="w-full rounded-xl border border-line bg-field py-3.5 pl-11 pr-4 text-sm text-ink outline-none transition-all placeholder:text-muted hover:border-muted focus:border-brand focus:bg-surface focus:ring-4 focus:ring-brand/10"
        />
      </div>
      <app-field-errors
        [touched]="restaurantForm.email().touched()"
        [errors]="restaurantForm.email().errors()"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label for="restaurant-phone" class="text-sm font-semibold text-ink/80"
        >Telefone / WhatsApp</label
      >
      <div class="relative">
        <ng-icon
          name="lucidePhone"
          size="18"
          class="absolute left-4 top-1/2 -translate-y-1/2 text-muted"
        />
        <input
          id="restaurant-phone"
          type="tel"
          inputmode="tel"
          autocomplete="tel"
          mask="(00) 0000-0000||(00) 00000-0000"
          placeholder="(00) 00000-0000"
          [formField]="restaurantForm.phone"
          class="w-full rounded-xl border border-line bg-field py-3.5 pl-11 pr-4 text-sm text-ink outline-none transition-all placeholder:text-muted hover:border-muted focus:border-brand focus:bg-surface focus:ring-4 focus:ring-brand/10"
        />
      </div>
      <app-field-errors
        [touched]="restaurantForm.phone().touched()"
        [errors]="restaurantForm.phone().errors()"
      />
    </div>

    <h2 class="text-base font-bold text-ink">Endereço do restaurante</h2>

    <div class="flex flex-col gap-2">
      <label for="restaurant-postal-code" class="text-sm font-semibold text-ink/80">CEP</label>
      <input id="restaurant-postal-code" type="text" inputmode="numeric" autocomplete="postal-code"
        mask="00000-000" placeholder="00000-000" [formField]="restaurantForm.postalCode"
        class="w-full rounded-xl border border-line bg-field px-4 py-3.5 text-sm text-ink outline-none focus:border-brand focus:ring-4 focus:ring-brand/10" />
      <app-field-errors [touched]="restaurantForm.postalCode().touched()" [errors]="restaurantForm.postalCode().errors()" />
    </div>

    <div class="flex flex-col gap-2">
      <label for="restaurant-street" class="text-sm font-semibold text-ink/80">Rua ou avenida</label>
      <input id="restaurant-street" type="text" autocomplete="address-line1" placeholder="Nome da rua ou avenida"
        [formField]="restaurantForm.street"
        class="w-full rounded-xl border border-line bg-field px-4 py-3.5 text-sm text-ink outline-none focus:border-brand focus:ring-4 focus:ring-brand/10" />
      <app-field-errors [touched]="restaurantForm.street().touched()" [errors]="restaurantForm.street().errors()" />
    </div>

    <div class="flex flex-col gap-2">
      <label for="restaurant-number" class="text-sm font-semibold text-ink/80">Número</label>
      <input id="restaurant-number" type="text" placeholder="Número ou S/N"
        [formField]="restaurantForm.number"
        class="w-full rounded-xl border border-line bg-field px-4 py-3.5 text-sm text-ink outline-none focus:border-brand focus:ring-4 focus:ring-brand/10" />
      <app-field-errors [touched]="restaurantForm.number().touched()" [errors]="restaurantForm.number().errors()" />
    </div>

    <div class="flex flex-col gap-2">
      <label for="restaurant-complement" class="text-sm font-semibold text-ink/80">Complemento <span class="font-normal text-muted">(opcional)</span></label>
      <input id="restaurant-complement" type="text" autocomplete="address-line2" placeholder="Sala, bloco ou ponto de referência"
        [formField]="restaurantForm.complement"
        class="w-full rounded-xl border border-line bg-field px-4 py-3.5 text-sm text-ink outline-none focus:border-brand focus:ring-4 focus:ring-brand/10" />
      <app-field-errors [touched]="restaurantForm.complement().touched()" [errors]="restaurantForm.complement().errors()" />
    </div>

    <div class="flex flex-col gap-2">
      <label for="restaurant-neighborhood" class="text-sm font-semibold text-ink/80">Bairro</label>
      <input id="restaurant-neighborhood" type="text" placeholder="Nome do bairro"
        [formField]="restaurantForm.neighborhood"
        class="w-full rounded-xl border border-line bg-field px-4 py-3.5 text-sm text-ink outline-none focus:border-brand focus:ring-4 focus:ring-brand/10" />
      <app-field-errors [touched]="restaurantForm.neighborhood().touched()" [errors]="restaurantForm.neighborhood().errors()" />
    </div>

    <div class="flex flex-col gap-2">
      <label for="restaurant-city" class="text-sm font-semibold text-ink/80">Cidade</label>
      <input id="restaurant-city" type="text" autocomplete="address-level2" placeholder="Nome da cidade"
        [formField]="restaurantForm.city"
        class="w-full rounded-xl border border-line bg-field px-4 py-3.5 text-sm text-ink outline-none focus:border-brand focus:ring-4 focus:ring-brand/10" />
      <app-field-errors [touched]="restaurantForm.city().touched()" [errors]="restaurantForm.city().errors()" />
    </div>

    <div class="flex flex-col gap-2">
      <label for="restaurant-state" class="text-sm font-semibold text-ink/80">UF</label>
      <select id="restaurant-state" autocomplete="address-level1" [formField]="restaurantForm.state"
        class="w-full rounded-xl border border-line bg-field px-4 py-3.5 text-sm text-ink outline-none focus:border-brand focus:ring-4 focus:ring-brand/10">
        <option value="">Selecione</option>
        @for (state of states; track state) {
          <option [value]="state">{{ state }}</option>
        }
      </select>
      <app-field-errors [touched]="restaurantForm.state().touched()" [errors]="restaurantForm.state().errors()" />
    </div>

    <div class="flex flex-col gap-2">
      <label for="restaurant-password" class="text-sm font-semibold text-ink/80">Senha</label>
      <div class="relative">
        <ng-icon
          name="lucideLockKeyhole"
          size="18"
          class="absolute left-4 top-1/2 -translate-y-1/2 text-muted"
        />
        <input
          id="restaurant-password"
          [type]="showPassword() ? 'text' : 'password'"
          autocomplete="new-password"
          placeholder="Mínimo de 8 caracteres"
          [formField]="restaurantForm.password"
          class="w-full rounded-xl border border-line bg-field py-3.5 pl-11 pr-12 text-sm text-ink outline-none transition-all placeholder:text-muted hover:border-muted focus:border-brand focus:bg-surface focus:ring-4 focus:ring-brand/10"
        />
        <button
          type="button"
          (click)="showPassword.update((value) => !value)"
          [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'"
          class="absolute inset-y-0 right-4 flex items-center text-muted hover:text-brand-2"
        >
          <ng-icon [name]="showPassword() ? 'lucideEyeOff' : 'lucideEye'" size="18" />
        </button>
      </div>
      <app-field-errors
        [touched]="restaurantForm.password().touched()"
        [errors]="restaurantForm.password().errors()"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label for="restaurant-confirm-password" class="text-sm font-semibold text-ink/80">
        Confirmar senha
      </label>
      <div class="relative">
        <ng-icon
          name="lucideLockKeyhole"
          size="18"
          class="absolute left-4 top-1/2 -translate-y-1/2 text-muted"
        />
        <input
          id="restaurant-confirm-password"
          [type]="showConfirmPassword() ? 'text' : 'password'"
          autocomplete="new-password"
          placeholder="Digite sua senha novamente"
          [formField]="restaurantForm.confirmPassword"
          class="w-full rounded-xl border border-line bg-field py-3.5 pl-11 pr-12 text-sm text-ink outline-none transition-all placeholder:text-muted hover:border-muted focus:border-brand focus:bg-surface focus:ring-4 focus:ring-brand/10"
        />
        <button
          type="button"
          (click)="showConfirmPassword.update((value) => !value)"
          [attr.aria-label]="showConfirmPassword() ? 'Ocultar senha' : 'Mostrar senha'"
          class="absolute inset-y-0 right-4 flex items-center text-muted hover:text-brand-2"
        >
          <ng-icon [name]="showConfirmPassword() ? 'lucideEyeOff' : 'lucideEye'" size="18" />
        </button>
      </div>
      <app-field-errors
        [touched]="restaurantForm.confirmPassword().touched()"
        [errors]="restaurantForm.confirmPassword().errors()"
      />
    </div>

    <button
      type="submit"
      [disabled]="restaurantForm().submitting()"
      [attr.aria-busy]="restaurantForm().submitting()"
      class="flex w-full items-center justify-center gap-2 rounded-xl bg-brand py-3.5 text-sm font-semibold text-white shadow-sm shadow-brand/20 transition-all hover:bg-brand/90 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand disabled:cursor-not-allowed disabled:opacity-60"
    >
      @if (restaurantForm().submitting()) {
        <ng-icon name="lucideLoaderCircle" size="18" class="motion-safe:animate-spin" aria-hidden="true" />
        Cadastrando...
      } @else {
        Cadastrar estabelecimento
        <ng-icon name="lucideArrowRight" size="18" />
      }
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-muted">
    Escolheu outro perfil?
    <a
      routerLink="/auth/user-profile"
      class="font-semibold text-brand hover:text-brand-2 hover:underline"
    >
      Voltar
    </a>
  </p>
  <a routerLink="/auth/resend-confirmation"
    class="mt-3 text-center text-sm font-semibold text-brand hover:text-brand-2 hover:underline">
    Já se cadastrou? Reenviar confirmação
  </a>
</section>
